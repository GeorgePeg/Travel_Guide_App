{% extends 'destinations/home.html' %}

{% block content %}
<div class="container py-5 my-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4 p-sm-5">
                    
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-camera-retro fa-3x text-primary mb-3"></i>
                        <h2 class="fw-bold">Προσθήκη Αξιοθέατου</h2>
                        <p class="text-muted small">Προσθήκη POI στον προορισμό <strong>{{ destination.title }}</strong></p>
                    </div>

                    <form method="POST" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}
                        
                        {% for field in form %}
                            <div class="mb-3">
                                <label for="{{ field.id_for_label }}" class="form-label fw-semibold small text-dark">
                                    {{ field.label }}
                                </label>
                                {{ field }}
                                {% for error in field.errors %}
                                    <div class="text-danger small mt-1">
                                        <i class="fa-solid fa-triangle-exclamation me-1"></i>{{ error }}
                                    </div>
                                {% endfor %}
                            </div>
                        {% endfor %}

                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 mt-4 fw-semibold shadow-sm">
                            <i class="fa-solid fa-plus me-1"></i>Προσθήκη Αξιοθέατου
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
